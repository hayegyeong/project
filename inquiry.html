<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>문의하기 | Moodly</title>

    <!-- CSS 연결 -->
    <link rel="stylesheet" href="css/inquiry.css">
</head>

<body>

    <div class="inquiry-container">

        <header class="inquiry-header">
            <button type="button" class="back-btn" onclick="goBack()">←</button>
            <h1>문의하기</h1>
        </header>

        <main class="inquiry-content">

            <p class="inquiry-description">
                궁금한 점이나 불편한 점을 남겨주세요.<br>
                확인 후 답변드리겠습니다.
            </p>

            <form id="inquiryForm">

                <div class="form-group">
                    <label for="category">문의 유형</label>

                    <select id="category" required>
                        <option value="">문의 유형을 선택해주세요</option>
                        <option value="service">서비스 이용 문의</option>
                        <option value="recommend">스타일 추천 문의</option>
                        <option value="error">오류 문의</option>
                        <option value="etc">기타 문의</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="title">제목</label>

                    <input
                        type="text"
                        id="title"
                        placeholder="문의 제목을 입력해주세요"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="content">문의 내용</label>

                    <textarea
                        id="content"
                        placeholder="문의하실 내용을 입력해주세요"
                        required
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="email">답변 받을 이메일</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@email.com"
                        required
                    >
                </div>

                <button type="submit" class="submit-btn">
                    문의하기
                </button>

            </form>

        </main>

    </div>

    <!-- JS 연결 -->
    <script src="js/inquiry.js"></script>

</body>
</html>
